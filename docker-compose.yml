services:
  web:
    image: nginx:latest
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
      - 8080:8080
    networks:
      - app-network
    depends_on:
      - php
      - php_test

  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: mongo:latest
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: "$DB_DATABASE"
      MONGO_INITDB_ROOT_USERNAME: "$MONGO_INITDB_ROOT_USERNAME"
      MONGO_INITDB_ROOT_PASSWORD: "$MONGO_INITDB_ROOT_PASSWORD"
    volumes:
      - dbdata:/data/db
    networks:
      - app-network

  selenium:
    image: selenium/standalone-chrome-debug:latest
    container_name: selenium
    ports:
      - 4444:4444
      - 5900:5900
    networks:
      - app-network

  php_test:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - app-network
    depends_on:
      - db
      - selenium
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 27017
      DB_DATABASE: problem_test

networks:
  app-network:
    driver: bridge

volumes:
  dbdata: